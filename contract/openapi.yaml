openapi: 3.0.0
info:
  title: Запись на звонок API
  version: 0.0.0
tags: []
paths:
  /api/event-types:
    get:
      operationId: EventTypes_listEventTypes
      description: Список типов встреч.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeList'
  /api/event-types/{id}/slots:
    get:
      operationId: EventTypes_listSlots
      description: Свободные слоты типа встречи на дату (дата в зоне владельца).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD (зона владельца).
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: Health_check
      description: Проверка живости сервиса.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
components:
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
      description: Ошибка API в единой форме.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 540
      description: 'Тип встречи: название, описание и длительность в минутах.'
    EventTypeList:
      type: object
      required:
        - eventTypes
      properties:
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
      description: Каталог типов встреч.
    SlotList:
      type: object
      required:
        - slots
      properties:
        slots:
          type: array
          items:
            type: string
      description: Свободные старты слотов на дату (ISO 8601 с offset зоны владельца).
servers:
  - url: http://localhost:3000
    description: dev server
    variables: {}
