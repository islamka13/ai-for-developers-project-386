openapi: 3.0.0
info:
  title: Запись на звонок API
  version: 0.0.0
tags: []
paths:
  /api/event-types:
    get:
      operationId: EventTypes_listEventTypes
      description: Список типов встреч.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeList'
  /api/health:
    get:
      operationId: Health_check
      description: Проверка живости сервиса.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
components:
  schemas:
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 540
      description: 'Тип встречи: название, описание и длительность в минутах.'
    EventTypeList:
      type: object
      required:
        - eventTypes
      properties:
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
      description: Каталог типов встреч.
servers:
  - url: http://localhost:3000
    description: dev server
    variables: {}
